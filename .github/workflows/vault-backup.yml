# BB HUB Obsidian — automated vault backup
#
# Schedule (UTC): daily commit/push at 02:00; weekly tag on Sunday 02:00.
# Adjust cron for your timezone: https://crontab.guru/
#
# Note: GitHub-hosted runners only see files already on GitHub.
# For local Obsidian edits, run 97_AUTOMATION/SCRIPTS/08_local_vault_backup.ps1
# on your PC (Task Scheduler ~01:30) before this workflow runs.

name: Vault Backup

on:
  schedule:
    - cron: "0 2 * * *"
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      force_commit:
        description: "Commit even if working tree appears unchanged (empty skip)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      create_weekly_tag:
        description: "Create weekly backup tag on current HEAD"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  issues: write

concurrency:
  group: vault-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Sync, commit, and tag
    runs-on: ubuntu-latest
    outputs:
      had_changes: ${{ steps.commit.outputs.had_changes }}
      weekly_tag: ${{ steps.weekly_tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Pull latest main
        run: git pull --rebase origin main

      - name: Stage all vault changes
        run: git add -A

      - name: Detect changes
        id: detect
        run: |
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No staged changes detected on remote checkout."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected — will commit."
            git diff --staged --stat
          fi

      - name: Commit changes
        id: commit
        if: steps.detect.outputs.changed == 'true' || inputs.force_commit == 'true'
        run: |
          if git diff --staged --quiet; then
            echo "had_changes=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to commit."
            exit 0
          fi
          MSG="chore(backup): automated daily vault snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git commit -m "$MSG"
          echo "had_changes=true" >> "$GITHUB_OUTPUT"
          echo "Committed: $MSG"

      - name: Push to main
        if: steps.commit.outputs.had_changes == 'true'
        run: git push origin main

      - name: Create weekly backup tag
        id: weekly_tag
        if: >-
          github.event.schedule == '0 2 * * 0' ||
          inputs.create_weekly_tag == 'true'
        run: |
          TAG="backup/weekly/$(date -u +%Y-%m-%d)"
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "Tag already exists: ${TAG}"
            exit 0
          fi
          git tag -a "${TAG}" -m "Weekly BB HUB vault backup $(date -u +%Y-%m-%d)"
          git push origin "${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Created weekly tag: ${TAG}"

      - name: Backup summary
        if: always()
        run: |
          {
            echo "## Vault backup summary"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Run | ${{ github.run_id }} |"
            echo "| Schedule | \`${{ github.event.schedule || 'manual' }}\` |"
            echo "| Changes committed | \`${{ steps.commit.outputs.had_changes || 'false' }}\` |"
            echo "| Weekly tag | \`${{ steps.weekly_tag.outputs.tag || 'n/a' }}\` |"
            echo "| Branch | \`main\` |"
            echo "| Time (UTC) | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
          } >> "$GITHUB_STEP_SUMMARY"

  notify-failure:
    name: Failure notification
    needs: backup
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub issue for backup failure
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Vault backup failed — ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              '## Automated vault backup failed',
              '',
              '| Field | Value |',
              '|-------|-------|',
              `| Workflow | ${context.workflow} |`,
              `| Run | [${context.runId}](${runUrl}) |`,
              `| Branch | ${context.ref} |`,
              `| Actor | ${context.actor} |`,
              '',
              '### What to check',
              '1. Actions permissions: **Settings → Actions → General → Workflow permissions** → Read and write.',
              '2. Branch protection rules blocking `github-actions[bot]` pushes.',
              '3. Local vault not pushed — run `08_local_vault_backup.ps1` on your PC.',
              '',
              'GitHub also emails watchers when workflows fail (if enabled in notification settings).'
            ].join('\n');

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'backup-failure'
            });

            const duplicate = openIssues.find(i => i.title.startsWith('Vault backup failed'));
            if (duplicate) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: duplicate.number,
                body: `Another failure: ${runUrl}`
              });
              core.info(`Commented on existing issue #${duplicate.number}`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['backup-failure', 'automated']
            });

      - name: Failure summary
        run: |
          {
            echo "## Backup failure"
            echo ""
            echo "A GitHub issue was opened (or updated) with label \`backup-failure\`."
            echo ""
            echo "Enable email: **GitHub Settings → Notifications → Actions**."
          } >> "$GITHUB_STEP_SUMMARY"